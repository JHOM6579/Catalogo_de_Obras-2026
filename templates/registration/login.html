{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5">
            <div class="info-card">
                <h1 class="h4 mb-4">Entrar</h1>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>

                <hr>

                <p class="mb-0">
                    Ainda não tem conta?
                    <a href="{% url 'cadastro_usuario' %}">
                        Solicitar acesso
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
